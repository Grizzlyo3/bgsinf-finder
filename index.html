<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>25x Rift Finder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .server {
      background: #222;
      border: 1px solid #444;
      margin: 10px auto;
      padding: 15px;
      border-radius: 10px;
      max-width: 500px;
    }
    .server button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #28a745;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }
    .server button:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <h1>🔍 Bubble Gum Simulator: 25x Rift Server Finder</h1>
  <div id="servers"></div>
  <script>
    async function loadServers() {
      const response = await fetch('http://localhost:3000/get-rift-servers');
      const data = await response.json();
      const container = document.getElementById('servers');

      if (data.length === 0) {
        container.innerHTML = '<p>No 25x Rift servers found at the moment.</p>';
        return;
      }

      data.forEach(server => {
        const div = document.createElement('div');
        div.className = 'server';
        div.innerHTML = `
          <h3>Server ID: ${server.id}</h3>
          <p>Players: ${server.playing} / ${server.maxPlayers}</p>
          <p>Ping: ${server.ping}</p>
          <p><code>${server.teleportCode}</code></p>
        `;
        container.appendChild(div);
      });
    }

    loadServers();
  </script>
</body>
</html>
